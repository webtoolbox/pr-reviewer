name: Test and Build

on:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            test_cmd: xvfb-run npx jest --no-coverage && xvfb-run npx electron test.js
            build_cmd: npx electron-builder --linux
            artifact: linux-build
            path: dist/*.deb
          - os: windows-latest
            test_cmd: echo "Skipping tests on Windows"
            build_cmd: npx electron-builder --win
            artifact: windows-build
            path: dist/*.exe
          - os: macos-latest
            test_cmd: echo "Skipping tests on macOS (run locally)"
            build_cmd: npm run build
            artifact: macos-build
            path: dist/*.dmg

    env:
      ELECTRON_DISABLE_SANDBOX: 1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: ${{ matrix.test_cmd }}
      - run: ${{ matrix.build_cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
