name: Build App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            build_cmd: npm run build
            artifact: macos-build
            path: dist/*.dmg
          - os: ubuntu-latest
            build_cmd: npx electron-builder --linux
            artifact: linux-build
            path: dist/*.deb
          - os: windows-latest
            build_cmd: npx electron-builder --win
            artifact: windows-build
            path: dist/*.exe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        if: matrix.os == 'macos-latest'
      - run: ${{ matrix.build_cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
